<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="88" height="94" viewBox="0 0 88 94">
  <!-- Orc Cibernético — "cartoon sério": massa arredondada, acento pontiagudo.
       Olhando para a DIREITA. Ancoragem: centro inferior (44, 94). Olho robótico em (64, 31).
       3 leituras: cabeça+elmo · tronco · braço com a clava de plasma.
       Contorno #1e1512: silhueta externa ~3.2 px (camada de contorno), linhas internas 1.5 px.
       Pele jade clara (maior massa clara) · armadura em bronze escurecido · só olho e ciano saturados. -->
  <defs>
    <!-- formas da silhueta (usadas duas vezes: contorno grosso por baixo + preenchimento por cima) -->
    <path id="legB"   d="M22 74 Q22 70 26 70 L32 70 Q36 70 36 74 L36 89 Q36 92 33 92 L25 92 Q22 92 22 89 Z"/>
    <path id="legF"   d="M42 74 Q42 70 46 70 L53 70 Q57 70 57 74 L58 89 Q58 92 55 92 L45 92 Q42 92 42 89 Z"/>
    <path id="club"   d="M70 70 L74 68 L76 72 C79 72 82 76 83 82 C84 88 81 92 77 92 C71 92 68 87 68 81 C68 78 69 76 71 74 Z"/>
    <path id="torso"  d="M20 76 C14 64 8 50 12 38 C15 30 26 26 40 26 C54 26 66 32 68 44 C70 56 64 68 60 76 Z"/>
    <path id="pauld"  d="M5 44 C3 36 10 29 22 28 C32 27 39 31 39 36 C34 42 18 47 5 44 Z"/>
    <path id="spike"  d="M13 31 L6 10 L24 28 Z"/>
    <path id="arm"    d="M52 52 C55 46 63 45 68 50 C73 56 78 62 78 67 C77 72 69 73 66 68 C62 62 55 58 52 52 Z"/>
    <path id="fist"   d="M66 69 C66 64 71 62 75 64 C79 66 80 71 77 74 C74 77 67 75 66 69 Z"/>
    <path id="head"   d="M44 38 C42 28 48 20 60 19 C71 18 78 24 78 32 C78 40 74 47 66 48 C56 49 46 46 44 38 Z"/>
    <path id="jaw"    d="M52 42 C60 44 70 43 80 39 C82 44 78 50 70 51 C62 52 54 49 52 42 Z"/>
    <path id="tusk"   d="M74 43 L84 32 L80.5 41.5 Z"/>
    <path id="helmet" d="M46 28 C47 20 53 16 62 16 C69 16 74 19 76 22 L83 23 L76 27.5 C68 26 57 26 46 28 Z"/>
  </defs>

  <!-- camada de contorno da silhueta -->
  <g fill="#1e1512" stroke="#1e1512" stroke-width="6.4" stroke-linejoin="round">
    <use href="#legB"/><use href="#legF"/><use href="#club"/><use href="#torso"/><use href="#pauld"/>
    <use href="#spike"/><use href="#arm"/><use href="#fist"/><use href="#head"/><use href="#jaw"/><use href="#tusk"/><use href="#helmet"/>
  </g>

  <g stroke="#1e1512" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round">
    <!-- pernas (grevas de bronze) -->
    <use href="#legB" fill="#4a2e1c"/>
    <use href="#legF" fill="#5c3a22"/>

    <!-- clava de plasma (atrás do punho) -->
    <use href="#club" fill="#6a4226"/>
    <path d="M80 76 C83 80 84 86 82 90 C80 92 79 92 77 92 C80 88 81 82 78 76 Z" fill="#40271a" stroke="none"/>
    <path d="M71 80 L78 78 M71 86 L79 84" fill="none" stroke="#3ff5ff" stroke-width="1.8"/>

    <!-- tronco: pele jade clara é a maior massa clara -->
    <use href="#torso" fill="#93bd9d"/>
    <path d="M60 76 C64 68 70 56 68 44 C66 36 60 31 56 29 C62 40 60 60 50 76 Z" fill="#66917a" stroke="none"/>

    <!-- cinto de bronze -->
    <path d="M19 68 C32 73 48 73 61 67 L60 75 C47 80 33 80 20 75 Z" fill="#74492a"/>

    <!-- ombreira de bronze com o único espinho -->
    <use href="#spike" fill="#9a6538"/>
    <use href="#pauld" fill="#74492a"/>
    <path d="M39 36 C34 42 18 47 5 44 C17 43 31 39 37 31 Z" fill="#4a2c1a" stroke="none"/>

    <!-- braço da frente + bracelete + punho -->
    <use href="#arm" fill="#93bd9d"/>
    <path d="M68 50 C73 56 78 62 78 67 C77 70 74 71 71 70 C72 62 69 55 64 50 Z" fill="#66917a" stroke="none"/>
    <path d="M63 57 C67 54 73 55 76 58 L77 64 C73 62 68 62 66 64 Z" fill="#74492a"/>
    <use href="#fist" fill="#85b192"/>

    <!-- cabeça larga e baixa -->
    <use href="#head" fill="#93bd9d"/>
    <path d="M78 32 C78 40 74 47 66 48 C58 49 52 47 50 45 C62 45 72 40 75 30 Z" fill="#66917a" stroke="none"/>
    <!-- sombra sob a borda do elmo, onde ficam os olhos -->
    <path d="M46 30 C56 27 68 27 76.5 28 L76 32 C68 31 56 32 47 35 Z" fill="#4d735e" stroke="none"/>
    <!-- mandíbula prognata com 2 presas -->
    <use href="#jaw" fill="#85b192"/>
    <path d="M64 44 L66.5 36 L69 44 Z" fill="#e4dcc2" stroke-width="1.2"/>
    <use href="#tusk" fill="#e4dcc2" stroke-width="1.2"/>

    <!-- elmo de bronze com borda pontuda na frente -->
    <use href="#helmet" fill="#74492a"/>
    <path d="M76 22 L83 23 L76 27.5 C73 27 70 26.5 66 26.5 C71 25 74 22 73 18 C75 19.5 76 21 76 22 Z" fill="#4a2c1a" stroke="none"/>

    <!-- ponto focal: visor do olho robótico (+ 3 detalhes pequenos: brilho da lente, cabo ciano, fenda do olho) -->
    <path d="M58 28 L66 25 L72 29 L69 36 L60 36 Z" fill="#2a1d17"/>
    <circle cx="64" cy="31" r="3.4" fill="#ff3b2f" stroke="none"/>
    <circle cx="63" cy="30" r="1.1" fill="#ffd6cc" stroke="none"/>
    <path d="M58 30 C54 28 51 27 47 26" fill="none" stroke="#3ff5ff" stroke-width="1.2"/>
    <path d="M50.5 33.2 L55.5 32.2" fill="none" stroke-width="2.2"/>

    <!-- brilhos do lado da luz (cima/esquerda) -->
    <path d="M10 37 C12 33 16 31 22 30 M51 22 C54 19 57 18 61 18" fill="none" stroke-width="2" stroke="#d39a5f"/>
    <path d="M56 50 C58 48 61 47 64 48 M14 50 C14 55 16 60 19 64" fill="none" stroke-width="2" stroke="#c2e2c6"/>
  </g>
</svg>
